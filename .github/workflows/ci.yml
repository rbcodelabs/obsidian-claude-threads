name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Catch versions.json drift on the PR, not at tag-push time. Failing in
      # the release workflow would mean the tag is already pushed and has to be
      # deleted and re-cut; failing here is just a normal red check.
      - name: Verify versions.json is in sync
        run: npm run check-versions
